name: Build and Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'tools/**'
      - 'editor/**'
      - '**/*.csproj'
      - '*.slnx'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.editorconfig'
      # So a change to this workflow actually runs it. Without this the filter skips
      # CI-only commits, which would leave a newly added job unverified until some
      # unrelated PR happened to touch code.
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'tools/**'
      - 'editor/**'
      - '**/*.csproj'
      - '*.slnx'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.editorconfig'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        timeout-minutes: 10
        run: dotnet test --no-build --configuration Release --verbosity normal --coverage --coverage-output-format cobertura --report-github --report-github-summary-include-passed false

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        env:
          REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
        with:
          reports: '**/TestResults/**/*.cobertura.xml'
          targetdir: coverage-report
          reporttypes: 'MarkdownSummaryGithub;Cobertura'
          filefilters: '-**/obj/**;-**/*.g.cs;-**/*.generated.cs'
          classfilters: '-System.*;-Microsoft.*;-*AnonymousType*'
          verbosity: 'Info'

      - name: Add coverage to summary
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: coverage-report/SummaryGithub.md

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        if: success()
        with:
          file: coverage-report/Cobertura.xml
          format: cobertura
        continue-on-error: true

  # The suite has never run on macOS: until now the only Apple Silicon coverage in the
  # repo was the AOT publish job in aot-compatibility.yml. This job exists to find out
  # what breaks, so it is deliberately NON-BLOCKING for its first outings — nothing here
  # has ever executed on macOS and wedging every PR on unknown platform failures would
  # be the wrong trade. Promote it to required once it has been green for a while
  # (tracked in the issue that added it).
  #
  # Coverage/reporting is intentionally omitted: Linux already produces those, and this
  # job answers a different question — does the engine work on Apple Silicon.
  test-macos:
    name: Test (macOS, Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No display on the runner, so windowed samples cannot be launched here; this
      # covers the headless suite only. Retina-specific rendering is covered by the
      # scaled-framebuffer unit tests rather than by real hardware.
      - name: Test
        timeout-minutes: 20
        run: dotnet test --no-build --configuration Release --verbosity normal

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build (required for source generators)
        run: dotnet build --configuration Release

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic
